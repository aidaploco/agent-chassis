name: Evals

# The behaviour suite needs a running Employee and makes real (paid) model
# calls, so it is not part of the per-PR CI gate (ci.yml / ci-success). It runs
# nightly against Lana on the real compose stack, and when the eval runner or
# this workflow changes. Failing here means "look at it", not "the PR is bad":
# model behaviour is probabilistic, which is why each case runs several times
# and must pass in most of them (EVAL_REPEAT / EVAL_MIN_PASS_RATE below).

on:
  schedule:
    - cron: "17 3 * * *" # nightly, off the hour
  workflow_dispatch:
    inputs:
      repeat:
        description: Runs per case
        default: "3"
  pull_request:
    paths:
      - .github/workflows/evals.yml
      - src/agent_chassis/evals/**

permissions:
  contents: read

concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  lana:
    # Secrets are not given to fork PRs, and this repo's own CI already skips
    # them; skip here too rather than fail on a missing key.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install dependencies
        run: uv sync --frozen

      - name: Write .env for compose
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::the OPENAI_API_KEY repository secret is not set"
            exit 1
          fi
          umask 077
          {
            echo "OPENAI_API_KEY=$OPENAI_API_KEY"
            echo "TEMPORAL_PAYLOAD_CODEC_KEY=$(openssl rand -base64 32)"
          } > .env

      - name: Start Lana (compose)
        run: ROLE_DIR=./examples/lana docker compose up -d --build

      - name: Wait for the API and the worker
        run: |
          for i in $(seq 1 90); do
            if curl -sf localhost:8001/healthz >/dev/null \
              && docker compose logs worker 2>&1 | grep -q "worker started"; then
              echo "stack is up"
              exit 0
            fi
            sleep 3
          done
          echo "::error::the stack did not come up in time"
          docker compose ps
          exit 1

      - name: Run the eval suite
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVAL_REPEAT: ${{ inputs.repeat || '3' }}
          EVAL_MIN_PASS_RATE: "0.67" # 2 of 3
          EVAL_CONCURRENCY: "4"
        run: |
          uv run python -m agent_chassis.evals http://localhost:8001 examples/lana/evals | tee eval.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Lana eval suite"
            echo '```'
            cat eval.txt 2>/dev/null || echo "(the suite did not produce output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Worker and API logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail=300 worker api

      - name: Tear down
        if: always()
        run: docker compose down -v
