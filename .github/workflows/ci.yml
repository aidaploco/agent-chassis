name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    # Skip PRs from forks: only this repository's own branches run CI.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Pyright (standard mode; config in pyproject.toml)
        run: uv run pyright
      - name: Import-linter (adapter seam, D2)
        run: uv run lint-imports

  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # One version: requires-python and the Docker image are both 3.15, so
        # the declared floor and what ships are the same interpreter. Kept as
        # a matrix so a future bump is one entry (test_ci_alignment enforces it).
        python-version: ["3.15"]
    # main requires only `ci-success`, which aggregates every leg, so legs can
    # be named freely (and a new Python version is one more matrix entry).
    name: test (python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}
      - name: Tests with coverage
        run: uv run --frozen --python ${{ matrix.python-version }} pytest --tb=short --cov --cov-report=term --cov-fail-under=80

  secrets:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history, not just the tip
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan history for secrets
        run: ./gitleaks git . --redact --verbose

  # The dev console (console/): a separate Node project, so its checks are their own
  # job. Same fork rule as the others.
  console:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests (what a turn's trace claims)
        run: npm test
      - name: Production build
        run: npm run build

  # The single check to require in branch protection / a ruleset. Requiring
  # lint, test and secrets individually means touching repo settings every time
  # a job is added or renamed; requiring this one means adding the job to
  # `needs:` below and nothing else.
  #
  # `if: always()` is load-bearing: without it a failed or skipped dependency
  # skips this job too, and GitHub treats a skipped required check as passing.
  #
  # Fail closed: only `success` counts. That includes `skipped`, so a fork PR
  # (whose jobs are deliberately skipped above) shows a red check instead of a
  # false green. A maintainer re-runs it from a branch in this repository.
  ci-success:
    needs: [lint, test, secrets, console]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          failed=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"')
          if [ -n "$failed" ]; then
            echo "::error::Not every required job succeeded:"
            echo "$failed"
            exit 1
          fi
