# Version updates (security alerts are separate and already on). Weekly and
# grouped, so a week of minor/patch bumps is one PR rather than a dozen.
# Every PR goes through the same ci-success gate as anything else.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The python base image and the pinned uv image in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
